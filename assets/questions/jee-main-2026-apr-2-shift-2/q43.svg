<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">Mutual inductance setup: concentric circular and square loops</title>
<desc id="desc">Schematic reconstruction for Physics Question 20. A circular loop of radius R is centered inside a coplanar square loop of side L, with L much greater than R. The drawing illustrates the geometry and is not certified as a pixel-exact copy of the original paper figure.</desc>
<rect width="720" height="460" fill="#fff"/>
<g stroke="#111827" stroke-width="4" fill="none" stroke-linejoin="round">
  <rect x="125" y="42" width="390" height="390" rx="1"/>
  <circle cx="320" cy="237" r="58"/>
  <path d="M125 237 H515 M320 42 V432" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/>
  <path d="M125 22 V34 M515 22 V34 M125 28 H515" stroke-width="1.7"/>
  <path d="M125 28 l12 -6 M125 28 l12 6 M515 28 l-12 -6 M515 28 l-12 6" stroke-width="1.7"/>
  <path d="M320 237 L378 237" stroke="#111827" stroke-width="2"/>
  <path d="M320 237 L320 179" stroke="#111827" stroke-width="2"/>
  <path d="M375 230 L382 237 L375 244" stroke="#111827" stroke-width="2"/>
  <path d="M313 182 L320 175 L327 182" stroke="#111827" stroke-width="2"/>
</g>
<g fill="#111827" font-family="Arial, Helvetica, sans-serif">
  <text x="320" y="17" text-anchor="middle" font-size="22">L</text>
  <text x="355" y="225" font-size="22">R</text>
  <text x="320" y="257" text-anchor="middle" font-size="15">common centre</text>
  <text x="535" y="170" font-size="20">Square loop</text>
  <text x="400" y="323" font-size="20">Circular loop</text>
  <text x="535" y="200" font-size="17">side L</text>
  <text x="535" y="350" font-size="17">radius R</text>
  <text x="320" y="450" text-anchor="middle" font-size="16" fill="#475569">Coplanar loops · L ≫ R · schematic reconstruction</text>
</g>
</svg>