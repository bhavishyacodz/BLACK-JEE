<title id="title">JEE Main 2026 April 2 Shift 2 Question 41 prism diagram</title>
<desc id="desc">An equilateral prism of refractive index 1.6 has its bottom face coated with paint of refractive index n2. A ray enters the left sloping face normally and travels inside toward the painted face.</desc>
