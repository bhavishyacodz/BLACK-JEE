<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="t d"><title id="t">Question 75 organic reaction sequence</title><desc id="d">p-nitrotoluene is reduced to p-toluidine, acetyl-protected, brominated and hydrolysed to a brominated toluidine product. Carius analysis measures bromide as silver bromide.</desc><rect width="760" height="260" fill="white"/><g stroke="#111" stroke-width="2.5" fill="none"><path d="M70 70 l25 -15 25 15 0 30 -25 15 -25 -15 z M310 70 l25 -15 25 15 0 30 -25 15 -25 -15 z M550 70 l25 -15 25 15 0 30 -25 15 -25 -15 z"/></g><g fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="17"><text x="68" y="48">NO₂</text><text x="68" y="137">CH₃</text><text x="308" y="48">NHCOCH₃</text><text x="308" y="137">CH₃; Br ortho</text><text x="548" y="48">NH₂</text><text x="548" y="137">CH₃; Br ortho</text><text x="150" y="86">Sn/HCl →</text><text x="390" y="86">Ac₂O; Br₂/AlBr₃; H₃O⁺ →</text><text x="24" y="200" font-size="18" font-weight="700">Q75 · Carius analysis</text><text x="24" y="225" font-size="16">1.0 g product P produces AgBr precipitate; find the nearest integer mass in grams.</text></g></svg>