name: BLACK-JEE screenshot crop processing

on:
  push:
    paths:
      - "assets/gemini-inbox/crop-manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: black-jee-question-crops
  cancel-in-progress: false

jobs:
  crop-and-attach:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processor
        if: hashFiles('assets/gemini-inbox/crop-manifest.json') != ''
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0

      - name: Check processor syntax
        if: hashFiles('assets/gemini-inbox/crop-manifest.json') != ''
        run: python -m py_compile scripts/process_question_crops.py

      - name: Process validated crop manifest
        if: hashFiles('assets/gemini-inbox/crop-manifest.json') != ''
        run: python scripts/process_question_crops.py

      - name: Commit permanent assets and remove processed source screenshots
        if: hashFiles('assets/gemini-inbox/crop-manifest.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/questions/jee-main-2026-apr-4-shift-1/shift-manifest.json
          git add assets/questions/jee-main-2026-apr-4-shift-1/manifest.json
          git add assets/questions/jee-main-2026-apr-4-shift-1/images
          git add assets/gemini-inbox
          if git diff --cached --quiet; then
            echo "No crop changes to commit."
            exit 0
          fi
          git commit -m "Process reviewed question screenshot crops"
          git push
