  <text x="627" y="111" font-size="21">P</text>
  <text x="330" y="130" font-size="20" fill="#2563eb">S₁P</text>
  <text x="330" y="260" font-size="20">S₂P</text>
  <text x="192" y="224" font-size="18">d</text>
  <text x="330" y="412" text-anchor="middle" font-size="16" fill="#475569">YDSE · path difference Δx = |S₁P − S₂P| · schematic reconstruction</text>
