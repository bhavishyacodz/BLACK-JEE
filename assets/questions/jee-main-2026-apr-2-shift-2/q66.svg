<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Question 66 answer-structure options</title><desc id="d">Four possible organic products: acrylic acid, crotonaldehyde, glycolic acid, and acetic acid.</desc><rect width="760" height="300" fill="white"/><g fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="22"><text x="24" y="35" font-weight="700">Q66 · Candidate product structures</text><text x="24" y="90">A</text><text x="65" y="90">CH₂=CH—COOH</text><text x="390" y="90">B</text><text x="430" y="90">CH₃—CH=CH—CHO</text><text x="24" y="160">C</text><text x="65" y="160">HO—CH₂—COOH</text><text x="390" y="160">D</text><text x="430" y="160">CH₃—COOH</text><text x="24" y="245" font-size="17">X has equal molar amounts of C, H and O; molar mass = 58 g mol⁻¹</text></g></svg>