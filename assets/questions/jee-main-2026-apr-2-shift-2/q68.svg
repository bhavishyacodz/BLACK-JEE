  <path d="M405 125 H520 M510 117 L520 125 L510 133"/>
  <rect x="540" y="91" width="125" height="68" rx="10"/>
  <path d="M680 125 H795 M785 117 L795 125 L785 133"/>
  <rect x="815" y="91" width="100" height="68" rx="10"/>
  <path d="M930 125 H1010 M1000 117 L1010 125 L1000 133"/>
  <rect x="1030" y="91" width="100" height="68" rx="10"/>
</g>
<g fill="#111" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <text x="96" y="83" font-size="16">C₂H₅</text>
  <text x="150" y="171" font-size="16">NO₂</text>
  <text x="340" y="132" font-size="23" font-weight="700">A</text>
  <text x="602" y="132" font-size="20" font-weight="700">Intermediate</text>
  <text x="865" y="132" font-size="23" font-weight="700">…</text>
  <text x="1080" y="132" font-size="23" font-weight="700">E</text>
  <text x="222" y="104" font-size="15">Br₂ / AlBr₃</text>
  <text x="462" y="101" font-size="14">Sn/HCl; NaNO₂/HCl</text>
  <text x="462" y="119" font-size="14">273–278 K; then C₂H₅OH</text>
  <text x="738" y="104" font-size="15">KMnO₄ / KOH</text>
  <text x="738" y="123" font-size="14">then H₃O⁺</text>
</g>
<g fill="#444" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <text x="28" y="220">Starting material: p-ethylnitrobenzene</text>
  <text x="28" y="244">A and E are deliberately represented as unknowns so this diagram does not reveal the multiple-choice answer.</text>
  <text x="28" y="268">The question statement supplies the reaction conditions; use them to infer the structures.</text>
</g>
