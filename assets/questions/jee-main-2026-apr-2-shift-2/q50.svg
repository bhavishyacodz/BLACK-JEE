<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-labelledby="title desc">
<title id="title">JEE Main 2026 April 2 Shift 2 Question 50 moment of inertia diagram</title>
<desc id="desc">A uniform rod of mass 40 kilograms and length 3 metres rotates about the vertical axis AB at its right end. A solid sphere of radius R has a vertical rotation axis through its centre, parallel to AB. The two parallel axes are separated by 3 metres.</desc>
<rect width="620" height="320" fill="white"/>
<g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M300 35 V275 M292 45 L300 30 L308 45 M292 265 L300 280 L308 265"/>
  <rect x="65" y="82" width="235" height="24" fill="#fff"/>
  <path d="M65 118 H300 M65 128 H300 M65 118 V128 M300 118 V128"/>
  <circle cx="105" cy="205" r="42" fill="#fff"/>
  <path d="M105 205 L130 181 M130 181 L124 183 M130 181 L128 188"/>
  <path d="M105 145 V265" stroke-dasharray="6 6"/>
  <path d="M105 205 H300" stroke-dasharray="5 6"/>
  <path d="M105 168 V242" stroke-width="1.5" stroke-dasharray="3 5"/>
</g>
<g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="20">
  <text x="312" y="45">A</text><text x="312" y="280">B</text>
  <text x="170" y="72">M = 40 kg</text><text x="155" y="148">Rod length = 3 m</text>
  <text x="126" y="185">R</text><text x="175" y="195">3 m between axes</text>
  <text x="120" y="288" font-size="16">Sphere axis through centre</text>
</g>
</svg>