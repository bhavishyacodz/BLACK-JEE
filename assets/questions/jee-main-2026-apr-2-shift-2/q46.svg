<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Young double-slit experiment schematic with point P</title>
<desc id="desc">Schematic reconstruction for Physics Question 21. Two coherent slits S1 and S2 illuminate a screen; point P is above the central axis. The path lengths S1P and S2P differ by delta x. This is an explanatory schematic, not a source-certified copy of the original figure.</desc>
