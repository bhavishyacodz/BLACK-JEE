<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
<title id="title">JEE Main 2026 April 2 Shift 2 Question 41 prism diagram</title>
<desc id="desc">An equilateral prism with refractive index 1.6 has its horizontal base coated with material of refractive index n2. A ray enters normally to the left face and continues straight to the painted base, where the incidence angle is 60 degrees.</desc>
<rect width="560" height="320" fill="white"/>
<g stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
  <path d="M100 260 L240 18 L380 260 Z" fill="white"/>
  <path d="M100 260 H380 V284 H100 Z" fill="#ddd"/>
  <path d="M100 260 H380 M100 267 H380 M100 275 H380 M100 283 H380" stroke-width="1.5"/>
  <path d="M25 139 L135 199 L239 260"/>
  <path d="M25 139 L40 141 M25 139 L32 152" stroke-width="2.5"/>
  <path d="M135 199 L121 196 M135 199 L132 185" stroke-width="2.5"/>
  <path d="M239 260 L228 250 M239 260 L238 245" stroke-width="2.5"/>
</g>
<g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="21">
  <text x="291" y="306">paint (n₂)</text>
  <text x="395" y="145">n = 1.6</text>
  <text x="18" y="120">incident ray</text>
  <text x="158" y="184">refracted ray</text>
  <text x="250" y="239">60°</text>
</g>
</svg>