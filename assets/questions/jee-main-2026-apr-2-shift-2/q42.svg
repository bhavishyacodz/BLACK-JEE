<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Alternating-current series RLC circuit with two inductor bypass switches</title>
<desc id="desc">An AC source v equals V zero sine 300t drives a single series loop containing capacitor C equals 100 microfarads, resistor R, inductor L2, and inductor L1. Switch S1 is wired in parallel across L2; switch S2 is wired in parallel across L1. Closing S1 bypasses L2, leaving L1 in the series circuit. Closing S2 bypasses L1, leaving L2 in the series circuit.</desc>
<rect width="900" height="390" fill="#fff"/>
<g stroke="#111827" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M105 90 H150 M190 90 H235 M305 90 H345"/>
  <path d="M150 72 V108 M190 72 V108"/>
  <path d="M235 90 l8 -10 l10 20 l10 -20 l10 20 l10 -20 l12 10"/>
  <path d="M345 90 H355"/>
  <path d="M355 90 c0 -24 18 -24 18 0 c0 -24 18 -24 18 0 c0 -24 18 -24 18 0 c0 -24 18 -24 18 0"/>
  <path d="M427 90 H465"/>
  <path d="M465 90 c0 -24 18 -24 18 0 c0 -24 18 -24 18 0 c0 -24 18 -24 18 0 c0 -24 18 -24 18 0"/>
  <path d="M537 90 H700 V280 H105 V200"/>
  <path d="M105 90 V130 M105 200 V280"/>
  <circle cx="105" cy="165" r="35" fill="#fff"/>
  <path d="M83 165 Q94 144 105 165 T127 165"/>
  <!-- S1 bypass branch across L2 -->
  <path d="M355 90 V158 H383 M411 158 H427 V90"/>
  <circle cx="383" cy="158" r="3.5" fill="#111827"/>
  <circle cx="411" cy="158" r="3.5" fill="#111827"/>
  <path d="M383 158 L405 143"/>
  <!-- S2 bypass branch across L1 -->
  <path d="M465 90 V220 H493 M521 220 H537 V90"/>
  <circle cx="493" cy="220" r="3.5" fill="#111827"/>
  <circle cx="521" cy="220" r="3.5" fill="#111827"/>
  <path d="M493 220 L515 205"/>
</g>
<g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="20">
  <text x="132" y="48">C = 100 μF</text>
  <text x="260" y="53">R</text>
  <text x="365" y="54">L₂</text>
  <text x="487" y="54">L₁</text>
  <text x="374" y="190">S₁</text>
  <text x="484" y="252">S₂</text>
  <text x="158" y="326">v = V₀ sin(300t)</text>
  <text x="560" y="345" font-size="16" fill="#374151">S₁ bypasses L₂ · S₂ bypasses L₁</text>
</g>
</svg>