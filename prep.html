function renderHome(){ $("topTitle").textContent="JEE Main";$("backBtn").style.visibility="hidden";$("app").innerHTML='<div class="eyebrow">CHAPTER-WISE PRACTICE</div><h1 class="headline">Your next rank starts here.</h1><p class="subline">Choose a subject and chapter to begin.</p><div class="tabs" id="subjectTabs"><button class="tab '+(subject==="Physics"?"active":"")+'" data-subject="Physics">Phy</button><button class="tab '+(subject==="Chemistry"?"active":"")+'" data-subject="Chemistry">Chem</button><button class="tab '+(subject==="Mathematics"?"active":"")+'" data-subject="Mathematics">Math</button><button class="tab '+(subject==="Home"?"active":"")+'" data-subject="Home">Home</button></div><input class="search" id="searchInput" type="search" placeholder="⌕  Search chapters or questions" value="'+esc($("searchInput")?$("searchInput").value:"")+'"><div class="filters"><button class="chip '+(topicFilter==="all"?"active":"")+'" data-filter="all">All chapters</button><button class="chip '+(topicFilter==="notstarted"?"active":"")+'" data-filter="notstarted">Not started</button><button class="chip '+(topicFilter==="withquestions"?"active":"")+'" data-filter="withquestions">Has PYQs</button></div><div class="summary"><span id="chapterSummary"></span><span id="totalQuestions"></span></div><div id="chapterList"></div><div class="notice" id="globalNotice" role="status"></div>';

function renderHub(){const solved=progress[chapter]?.solved||0,correct=progress[chapter]?.correct||0,acc=solved?Math.round(correct/solved*100):0; $("topTitle").textContent=chapter;$("backBtn").style.visibility="visible";$("app").innerHTML='<div class="eyebrow">'+subject+'</div><h1 class="headline">'+esc(chapter)+'</h1><p class="subline">Your chapter command centre. Build accuracy one question at a time.</p><div class="section-head">Your Progress <span class="tag">'+chapterQuestions.length+' PYQs</span></div><div class="metric-grid"><div class="metric"><strong>'+solved+'/'+chapterQuestions.length+'</strong><span>Solved PYQs</span></div><div class="metric"><strong>'+correct+'/'+solved+'</strong><span>Correct Qs</span></div><div class="metric"><strong>'+acc+'.0%</strong><span>Accuracy</span></div></div><div class="hero-card"><div class="hero-title">All India Chapter Percentile</div><div class="hero-copy">'+(showAllPercentile?"Percentile insights will appear here when a verified ranking service is connected.":"Solve 30 PYQs to build a meaningful chapter practice record. Ranking is not enabled yet.")+'</div><div style="margin-top:12px"><button class="btn" id="percentileToggle">'+(showAllPercentile?"Hide details":"Learn more")+'</button></div></div><div class="section-head">Start practising</div><button class="action-card primary" id="allPyqs"><span class="action-icon">◷</span><span class="action-copy"><span class="action-title">All Previous Year Questions</span><span class="action-sub">'+chapterQuestions.length+' published PYQs · practice or timed test</span></span><span class="action-arrow">›</span></button><div class="twocol"><button class="smalltile" id="topicWise"><strong>Topic-Wise PYQs →</strong><span>Browse questions by subtopic where available</span></button><button class="smalltile gold" id="recommended"><strong>🏆 Most Relevant PYQs</strong><span>Recommended practice set</span></button><button class="smalltile" id="beginner"><strong>Beginner Qs</strong><span>Start with the basics</span></button><button class="smalltile" id="rankbooster"><strong>Rank Booster</strong><span>Challenge your accuracy</span></button><button class="smalltile" id="advanced"><strong>Advanced</strong><span>Stretch your problem-solving</span></button></div>';

function renderDirectory(){ $("topTitle").textContent=chapter;$("backBtn").style.visibility="visible";$("app").innerHTML='<div class="eyebrow">'+subject+' · CHAPTER DIRECTORY</div><h1 class="headline">'+esc(chapter)+'</h1><p class="subline">'+chapterQuestions.length+' published questions · select a question to open the solver.</p><div class="tabs" style="grid-template-columns:repeat(2,1fr)"><button class="tab '+(mode!=="topics"?"active":"")+'" id="allTab">All PYQs</button><button class="tab '+(mode==="topics"?"active":"")+'" id="topicTab">Topic-Wise PYQs</button></div><div class="modegrid"><button class="mode '+(mode==="practice"?"active":"")+'" id="practiceMode"><strong>Practice Chapter →</strong><span>Solve and check answers one by one</span></button><button class="mode '+(mode==="test"?"active":"")+'" id="testMode"><strong>Take Chapter Test →</strong><span>Timed session · '+chapterQuestions.length+' questions</span></button></div><div class="switchrow"><span>Hide attempted questions</span><input class="switch" type="checkbox" id="hideAttempted" '+(hideAttempted?"checked":"")+'></div><div class="filters"><span class="chip">Diagram based ('+chapterQuestions.filter(q=>q.image_url).length+')</span><span class="chip">Math & equations supported</span><span class="chip">Published questions only</span></div><div class="summary"><span>'+ (mode==="topics"?"Topic view · topics depend on available question metadata":"Question feed")+'</span><span>'+chapterQuestions.length+' total</span></div><div id="questionFeed"></div><div class="notice" id="directoryNotice"></div>';
 $("allTab").addEventListener("click",()=>{mode="practice";renderDirectory();});$("topicTab").addEventListener("click",()=>{mode="topics";renderDirectory();});$("practiceMode").addEventListener("click",()=>{mode="practice";renderDirectory();});$("testMode").addEventListener("click",()=>{mode="test";testStartedAt=Date.now();renderDirectory();});$("hideAttempted").addEventListener("change",e=>{hideAttempted=e.target.checked;renderDirectory();});
 let qs=chapterQuestions.filter(q=>!hideAttempted||!attempted.has(String(q.id)));if(mode==="recommended")qs=qs.slice(0,Math.min(30,qs.length));if(mode==="beginner")qs=qs.slice(0,Math.min(15,qs.length));if(mode==="rankbooster")qs=qs.slice(Math.max(0,Math.floor(qs.length/3)));if(mode==="advanced")qs=qs.slice(Math.floor(qs.length/2));if(mode==="topics"){const topics=[...new Set(chapterQuestions.map(q=>q.topic||q.subtopic).filter(Boolean))];if(topics.length){$("questionFeed").innerHTML=topics.map(t=>'<button class="action-card" data-topic="'+esc(t)+'"><span class="action-icon">▦</span><span class="action-copy"><span class="action-title">'+esc(t)+'</span><span class="action-sub">'+chapterQuestions.filter(q=>(q.topic||q.subtopic)===t).length+' PYQs</span></span><span class="action-arrow">›</span></button>').join("");$("questionFeed").querySelectorAll("[data-topic]").forEach(b=>b.addEventListener("click",()=>{chapterQuestions=chapterQuestions.filter(q=>(q.topic||q.subtopic)===b.dataset.topic);mode="practice";renderDirectory();}));return;}$("questionFeed").innerHTML='<div class="card empty">Topic labels are not available in the current published question records. Use All PYQs to browse every question in this chapter.</div>';return;}
 $("questionFeed").innerHTML=qs.length?qs.map((q,i)=>'<button class="question-card" data-qid="'+esc(q.id)+'"><div class="qtop"><span class="qnum">Q'+String(i+1).padStart(2,"0")+'</span><span class="tag">'+esc(String(q.year||"JEE Main"))+'</span></div><div class="qpreview">'+esc(q.question_text||"Question text unavailable")+'</div><div class="question-meta"><span class="tag">'+esc(q.session||"JEE Main")+'</span><span class="tag">'+esc(q.question_type||"Question")+'</span>'+(q.image_url?'<span class="tag">▧ Diagram</span>':'')+(attempted.has(String(q.id))?'<span class="tag">Attempted</span>':'')+'</div></button>').join(""):'<div class="card empty">No questions left in this view. Turn off “Hide attempted” or return to the chapter dashboard.</div>';
 $("questionFeed").querySelectorAll("[data-qid]").forEach((b,i)=>b.addEventListener("click",()=>{questionIndex=chapterQuestions.findIndex(q=>String(q.id)===b.dataset.qid);selectedAnswer=null;graded=null;correctAnswerVisible=false;startedAt=Date.now();seconds=0;setScreen("solver");}));typeset($("questionFeed"));}
async function checkAnswer(){const q=chapterQuestions[questionIndex];if(selectedAnswer===null||selectedAnswer===""){return;}const answer=q.question_type==="MCQ"?String.fromCharCode(65+Number(selectedAnswer)):String(selectedAnswer).trim();const btn=$("checkBtn");btn.disabled=true;btn.textContent="Checking…";try{const {data,error}=await db.rpc("grade_jee_pyq",{p_question_id:q.id,p_answer:answer});if(error)throw error;graded=data;const answeredId=String(q.id);solutionResults[answeredId]=data;if(!data?.is_correct)wrongAttempts[answeredId]=(wrongAttempts[answeredId]||0)+1;if(!attempted.has(answeredId)){attempted.add(answeredId);const p=progress[chapter]||{solved:0,correct:0};p.solved+=1;if(data&&data.is_correct)p.correct+=1;progress[chapter]=p;}renderSolver();}catch(e){btn.disabled=false;btn.textContent="Check Answer";$("solverNotice").textContent="Answer check failed: "+e.message;}}
function renderSolver(){const q=chapterQuestions[questionIndex];const qid=String(q.id);const solutionRecord=graded||solutionResults[qid];const solutionUnlocked=(wrongAttempts[qid]||0)>=2;$("topTitle").textContent=chapter;$("backBtn").style.visibility="visible";const qnum=questionIndex+1;let optionHtml="";if(q.question_type==="MCQ"){optionHtml='<div class="options">'+optionsOf(q).map((o,i)=>{let cls="option";if(selectedAnswer!==null&&Number(selectedAnswer)===i)cls+=" selected";if(graded&&graded.is_correct&&Number(selectedAnswer)===i)cls+=" correct";if(graded&&!graded.is_correct&&Number(selectedAnswer)===i)cls+=" incorrect";return '<button class="'+cls+'" data-option="'+i+'" '+(graded?"disabled":"")+'><span class="option-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(prettyQuestionText(o))+'</span>'+(graded&&!graded.is_correct&&Number(selectedAnswer)===i?'<span class="tag">Your answer ✕</span>':graded&&graded.is_correct&&Number(selectedAnswer)===i?'<span class="tag">Correct ✓</span>':'')+'</button>';}).join("")+'</div>';}else{optionHtml='<label class="muted" for="numericalInput">Numerical answer</label><input class="search" id="numericalInput" value="'+esc(selectedAnswer||"")+'" placeholder="Enter your answer" '+(graded?"disabled":"")+'>';}
 $("app").innerHTML='<div class="eyebrow">'+subject+' · '+esc(chapter)+'</div><div class="qtop" style="margin:10px 0 15px"><h1 class="headline" style="margin:0">Q '+qnum+' / '+chapterQuestions.length+'</h1><span class="timerpill" id="liveTimer">00s</span></div><div class="question-meta" style="margin:0 0 16px"><span class="tag">'+esc(fmt(q))+'</span><span class="tag">'+esc(q.question_type||"Question")+'</span><button class="chip" id="bookmarkBtn">'+(bookmarks.has(String(q.id))?"★ Saved":"☆ Save")+'</button></div><article class="card"><div class="question-body mathjax-container">'+esc(q.question_text||"Question text unavailable")+'</div>'+questionImageHtml(q)+'</article>'+(graded?'<div class="feedback '+(graded.is_correct?"good":"bad")+'"><strong>'+(graded.is_correct?"Correct answer ✓":"Not quite — keep going")+'</strong><div style="margin-top:5px">'+(graded.is_correct?"Your answer is correct.":((wrongAttempts[String(q.id)]||0)+" of 2 incorrect attempts · "+((wrongAttempts[String(q.id)]||0)>=2?"Solution unlocked. Review the method, then continue.":"Try once more to unlock the solution.")))+'</div></div>':'')+(solutionUnlocked?'<button class="btn full solution-cta" id="showCorrect">✦ '+(correctAnswerVisible?"Hide solution":"Show solution")+' <span class="muted">· unlocked</span></button>':'')+(correctAnswerVisible&&solutionRecord?'<div class="card solution-card"><div class="eyebrow">SOLUTION</div><strong>Correct answer: '+esc(solutionRecord.correct_answer??"Not supplied")+'</strong>'+(solutionRecord.solution?'<div class="question-body" style="margin-top:10px">'+esc(solutionRecord.solution)+'</div>':'<p class="muted">The correct answer is available, but no written explanation was supplied for this question.</p>')+'</div>':'')+optionHtml+'<div class="notice" id="solverNotice"></div><div class="solver-actions"><button class="btn" id="prevQuestion" '+(questionIndex===0?"disabled":"")+'>← Previous</button><button class="btn primary" id="checkBtn" '+(graded&&graded.is_correct?"disabled":(!graded&&selectedAnswer===null?"disabled":""))+'>'+(graded?(graded.is_correct?"Correct ✓":"Try Again ↻"):"Check Answer")+'</button><button class="btn" id="nextQuestion" '+(questionIndex>=chapterQuestions.length-1?"disabled":"")+'>Next →</button></div><div style="margin-top:9px"><button class="btn full" id="backDirectory">Back to question list</button></div>';
 $("app").querySelectorAll("[data-option]").forEach(b=>b.addEventListener("click",()=>{selectedAnswer=Number(b.dataset.option);renderSolver();}));const num=$("numericalInput");if(num)num.addEventListener("input",e=>{selectedAnswer=e.target.value;const c=$("checkBtn");if(c)c.disabled=!String(selectedAnswer).trim();});$("checkBtn").addEventListener("click",()=>{if(graded&&!graded.is_correct){selectedAnswer=null;graded=null;correctAnswerVisible=false;renderSolver();}else if(!graded)checkAnswer();});$("prevQuestion").addEventListener("click",()=>moveQuestion(-1));$("nextQuestion").addEventListener("click",()=>moveQuestion(1));$("backDirectory").addEventListener("click",()=>setScreen("directory"));$("bookmarkBtn").addEventListener("click",()=>{const id=String(q.id);if(bookmarks.has(id))bookmarks.delete(id);else bookmarks.add(id);renderSolver();});const reveal=$("showCorrect");if(reveal)reveal.addEventListener("click",()=>{correctAnswerVisible=!correctAnswerVisible;renderSolver();});typeset($("app"));startTimer();}
function startTimer(){if(timerHandle)clearInterval(timerHandle);const update=()=>{const elapsed=Math.floor((Date.now()-(mode==="test"&&testStartedAt?testStartedAt:startedAt))/1000);const remaining=mode==="test"?Math.max(0,1800-elapsed):elapsed;const el=$("liveTimer");if(el)el.textContent=mode==="test"?(remaining===0?"TIME UP":String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0")):(elapsed<60?String(elapsed).padStart(2,"0")+"s":String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0"));if(mode==="test"&&remaining===0){document.querySelectorAll("[data-option]").forEach(b=>b.disabled=true);const notice=$("solverNotice");if(notice)notice.textContent="The 30-minute test timer has ended. Return to the question list to review your session.";if(timerHandle){clearInterval(timerHandle);timerHandle=null;}}};update();if(!(mode==="test"&&testStartedAt&&Date.now()-testStartedAt>=1800000))timerHandle=setInterval(update,1000);}
function moveQuestion(delta){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}questionIndex=Math.max(0,Math.min(chapterQuestions.length-1,questionIndex+delta));selectedAnswer=null;graded=null;correctAnswerVisible=false;startedAt=Date.now();seconds=0;renderSolver();}
function renderScreen(){if(timerHandle&&screen!=="solver"){clearInterval(timerHandle);timerHandle=null;}if(screen==="home")renderHome();else if(screen==="hub")renderHub();else if(screen==="directory")renderDirectory();else if(screen==="solver")renderSolver();else renderHome();document.querySelectorAll("[data-bottom]").forEach(b=>b.classList.toggle("active",b.dataset.bottom===(screen==="home"?"home":screen==="hub"?"progress":screen==="directory"?"practice":"bookmarks")));}
document.querySelectorAll("[data-bottom]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.bottom==="home")setScreen("home");else if(b.dataset.bottom==="practice"){if(chapter)setScreen("directory");else setNotice("Choose a chapter first.");}else if(b.dataset.bottom==="bookmarks"){const ids=[...bookmarks];if(!ids.length){setNotice("No saved questions yet.");return;}const first=bank.findIndex(q=>String(q.id)===ids[0]);if(first>=0){let q=bank[first];subject=q.subject;chapter=q.chapter;chapterQuestions=bank.filter(x=>x.subject===subject&&x.chapter===chapter);questionIndex=chapterQuestions.findIndex(x=>String(x.id)===String(q.id));selectedAnswer=null;graded=null;setScreen("solver");}}else{if(chapter)setScreen("hub");else setNotice("Open a chapter to see your practice progress.");}}));
async function boot(){try{const mod=await import("https://esm.sh/@supabase/supabase-js@2");db=mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data,error}=await db.from("jee_pyq_questions").select("id,year,session,subject,chapter,question_text,options,question_type,marks_correct,marks_wrong,created_at,image_url").eq("is_published",true).order("year",{ascending:false}).order("created_at",{ascending:false});if(error)throw error;bank=data||[];renderHome();setNotice(bank.length?("Question bank connected · "+bank.length+" published PYQs loaded. Answers are checked by the protected grading function."):"No published PYQs are available yet.");}catch(e){renderHome();setNotice("Could not load the published question bank: "+e.message,true);}}
renderHome();boot();
