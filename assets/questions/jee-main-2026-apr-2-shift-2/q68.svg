<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-labelledby="title desc">
<title id="title">Question 68 aromatic reaction sequence</title>
<desc id="desc">p-ethylnitrobenzene is brominated with Br2 and AlBr3 to form unknown A. The sequence then uses Sn/HCl, NaNO2/HCl at 273–278 K, ethanol, and finally KMnO4/KOH followed by acidification to form unknown E. Structures of A and E are intentionally not shown because the question asks students to identify them.</desc>
<rect width="1180" height="300" fill="#fff"/>
<g fill="#111" font-family="Arial, Helvetica, sans-serif">
  <text x="28" y="34" font-size="20" font-weight="700">Q68 · Identify A and E</text>
  <text x="28" y="57" font-size="14" fill="#444">Reaction sequence schematic — unknown structures remain hidden</text>
</g>
<g stroke="#111" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <path d="M70 110 L96 95 L122 110 L122 140 L96 155 L70 140 Z"/>
  <path d="M70 110 L48 97 M122 140 L144 153"/>
