<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">JEE Main 2026 April 2 Shift 2 Question 42 LCR circuit</title>
<desc id="desc">The AC source v equals V0 sin 300t connects to the bottom rail. The top rail contains a 100 microfarad capacitor and resistor R in series. Inductor L2 connects between the left top node and bottom rail, with switch S1 in parallel across L2. Inductor L1 connects between the right top node and bottom rail, with switch S2 in parallel across L1.</desc>
<rect width="760" height="320" fill="white"/>
<g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main top rail and series capacitor/resistor -->
  <path d="M105 80 H170 M220 80 H290 M370 80 H495"/>
  <path d="M170 80 V66 M220 80 V66 M170 66 H220"/>
  <path d="M170 80 V94 M220 80 V94 M170 94 H220"/>
  <path d="M290 80 l8 -8 l8 16 l8 -16 l8 16 l8 -16 l8 8"/>
  <!-- Left shunt inductor L2 -->
  <path d="M105 80 V118"/>
  <path d="M105 118 c-22 0 -22 18 0 18 c-22 0 -22 18 0 18 c-22 0 -22 18 0 18 c-22 0 -22 18 0 18"/>
  <path d="M105 190 V244"/>
  <!-- S1 branch parallel to L2 -->
  <path d="M105 80 H65 V126 M65 178 V244 H105"/>
  <path d="M65 126 V141 M65 163 V178 M65 141 L78 151"/>
  <!-- Right shunt inductor L1 -->
  <path d="M495 80 V118"/>
  <path d="M495 118 c-22 0 -22 18 0 18 c-22 0 -22 18 0 18 c-22 0 -22 18 0 18 c-22 0 -22 18 0 18"/>
  <path d="M495 190 V244"/>
  <!-- S2 branch parallel to L1 -->
  <path d="M495 80 H550 V126 M550 178 V244 H495"/>
  <path d="M550 126 V141 M550 163 V178 M550 141 L563 151"/>
  <!-- Bottom rail and AC source -->
  <path d="M105 244 H280 M360 244 H495"/>
  <circle cx="320" cy="244" r="40" fill="white"/>
  <path d="M296 244 Q308 222 320 244 T344 244"/>
</g>
<g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="20">
  <text x="157" y="45">C = 100 μF</text>
  <text x="318" y="55">R</text>
  <text x="122" y="165">L₂</text>
  <text x="512" y="165">L₁</text>
  <text x="35" y="115">S₁</text>
  <text x="570" y="115">S₂</text>
  <text x="250" y="304">v = V₀ sin(300t)</text>
</g>
</svg>