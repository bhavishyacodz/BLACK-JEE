  <path d="M150 190 L580 105 M150 250 L580 105" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M150 190 L580 220 M150 250 L580 220" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 6"/>
  <path d="M610 55 V385" stroke-width="7"/>
  <path d="M580 105 H610" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M580 220 H610" stroke="#64748b" stroke-width="1.7"/>
  <path d="M150 190 V250" stroke="#111827" stroke-width="1.5"/>
  <path d="M150 190 H173 M150 250 H173" stroke="#111827" stroke-width="1.5"/>
  <path d="M183 190 V250 M177 198 L183 190 L189 198 M177 242 L183 250 L189 242" stroke-width="1.5"/>
  <circle cx="610" cy="105" r="6" fill="#2563eb"/>
  <circle cx="610" cy="220" r="6" fill="#111827"/>
  <path d="M150 220 H610" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 7"/>
</g>
