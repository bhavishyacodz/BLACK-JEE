<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
<title id="title">Question 67 enol ether structure</title>
<desc id="desc">The molecule is CH3-CH=CH-O-C(CH3)=CH2, an enol ether that hydrolyses under mild acidic conditions to propanal and acetone.</desc>
<rect width="760" height="230" fill="white"/>
<g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M115 90 H175 M115 99 H175 M175 90 L220 65 M220 65 L265 90 M220 65 L220 38"/>
<path d="M265 90 H330 M390 90 H450 M450 90 L495 65 M450 90 L495 115 M450 90 L450 135 M450 90 L505 90 M505 90 H555 M505 82 H555"/>
</g>
<g fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="23">
<text x="55" y="99">CH₃—</text><text x="178" y="55">CH</text><text x="239" y="117">CH</text><text x="340" y="99">O</text><text x="454" y="55">C</text><text x="495" y="61">CH₃</text><text x="493" y="139">CH₂</text>
<text x="24" y="190" font-size="18">Hydrolysis under mild acidic conditions gives propanal and acetone.</text>
</g>
</svg>