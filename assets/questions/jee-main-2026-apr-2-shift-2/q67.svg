<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" role="img" aria-labelledby="t d"><title id="t">Question 67 enol ether structure</title><desc id="d">The source question shows an unsaturated ether that hydrolyses under mild acidic conditions into two carbonyl compounds.</desc><rect width="680" height="220" fill="white"/><g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"><path d="M100 85 L150 55 L200 85 M150 55 L150 105 M200 85 H270 M320 85 H380 M380 85 L430 55 M380 85 L430 115"/></g><g fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="24"><text x="55" y="92">CH₃</text><text x="145" y="48">CH</text><text x="195" y="92">CH</text><text x="282" y="92">O</text><text x="390" y="92">C</text><text x="437" y="59">CH₃</text><text x="437" y="124">CH₂</text><text x="24" y="180" font-size="17">Hydrolysis under mild acidic conditions gives carbonyl products Y and Z.</text></g></svg>