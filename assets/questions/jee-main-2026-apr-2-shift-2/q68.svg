<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="t d"><title id="t">Question 68 reaction sequence</title><desc id="d">Ethyl nitrobenzene undergoes bromination, nitro reduction, diazotization, ethanol treatment and oxidation of the ethyl substituent to a carboxylic acid.</desc><rect width="900" height="250" fill="white"/><g stroke="#111" stroke-width="2.5" fill="none"><path d="M70 65 l25 -15 25 15 0 30 -25 15 -25 -15 z M270 65 l25 -15 25 15 0 30 -25 15 -25 -15 z M470 65 l25 -15 25 15 0 30 -25 15 -25 -15 z M670 65 l25 -15 25 15 0 30 -25 15 -25 -15 z"/></g><g fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="16"><text x="73" y="44">C₂H₅</text><text x="74" y="129">NO₂ (para)</text><text x="274" y="44">C₂H₅</text><text x="274" y="129">Br + NO₂</text><text x="474" y="44">C₂H₅</text><text x="474" y="129">Br + NH₂</text><text x="674" y="44">COOH</text><text x="674" y="129">Br (ortho)</text><text x="145" y="83">Br₂/AlBr₃ →</text><text x="345" y="83">Sn/HCl; then diazotize →</text><text x="545" y="83">C₂H₅OH, then KMnO₄ →</text><text x="30" y="200" font-size="18" font-weight="700">Q68 · Identify A and E in the reaction sequence</text><text x="30" y="225" font-size="15">Bromination occurs ortho to ethyl; deamination replaces –NH₂ by H; side-chain oxidation gives the benzoic acid.</text></g></svg>